<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download Accelerator</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
          <path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12L13 2Z" fill="url(#bolt)"/>
          <defs>
            <linearGradient id="bolt" x1="4" y1="2" x2="20" y2="22" gradientUnits="userSpaceOnUse">
              <stop stop-color="#7dd3fc"/><stop offset="1" stop-color="#6366f1"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div class="brand-text">
        <h1>Download Accelerator</h1>
        <span class="tagline">multi-segment · parallel · resumable</span>
      </div>
    </div>

    <div class="speed-panel">
      <canvas id="spark" width="220" height="46" aria-hidden="true"></canvas>
      <div class="speed-readout">
        <span class="speed-value" id="globalSpeed">0 B/s</span>
        <span class="speed-label">total speed</span>
      </div>
    </div>

    <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
      </svg>
    </button>
  </header>

  <main class="container">
    <section class="add-card">
      <form id="addForm" autocomplete="off">
        <div class="url-row">
          <div class="url-input-wrap">
            <svg class="link-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
            </svg>
            <input type="url" id="urlInput" placeholder="Paste a download URL — e.g. https://example.com/big-file.zip" required />
          </div>
          <div class="seg-select" title="Parallel segments per download">
            <label for="segCount">Segments</label>
            <select id="segCount">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="4">4</option>
              <option value="8" selected>8</option>
              <option value="12">12</option>
              <option value="16">16</option>
            </select>
          </div>
          <button type="submit" class="primary-btn" id="addBtn">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/>
            </svg>
            Download
          </button>
        </div>
        <div class="url-row secondary">
          <input type="text" id="nameInput" placeholder="Rename file (optional)" />
          <div class="samples">
            <span class="samples-label">Try:</span>
            <button type="button" class="chip" data-sample="https://registry.npmjs.org/typescript/-/typescript-5.9.3.tgz">npm tarball · 8 MB</button>
            <button type="button" class="chip" data-sample="https://registry.npmjs.org/lodash/-/lodash-4.17.21.tgz">lodash · 312 KB</button>
            <button type="button" class="chip" data-sample="https://codeload.github.com/anthemyear-glitch/Claude-Pro/zip/refs/heads/master">GitHub zip</button>
          </div>
        </div>
      </form>

      <div class="stats-row" id="statsRow">
        <div class="stat">
          <span class="stat-value" id="statActive">0</span>
          <span class="stat-label">active</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="statQueued">0</span>
          <span class="stat-label">queued</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="statDone">0</span>
          <span class="stat-label">completed</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="statError">0</span>
          <span class="stat-label">errors</span>
        </div>
      </div>
    </section>

    <section class="list-section" id="sectionActive" hidden>
      <h2 class="section-title"><span class="dot dot-live"></span> Active &amp; queued</h2>
      <div class="task-list" id="listActive"></div>
    </section>

    <section class="list-section" id="sectionPaused" hidden>
      <h2 class="section-title"><span class="dot dot-paused"></span> Paused &amp; errors</h2>
      <div class="task-list" id="listPaused"></div>
    </section>

    <section class="list-section" id="sectionDone" hidden>
      <h2 class="section-title"><span class="dot dot-done"></span> Completed</h2>
      <div class="task-list" id="listDone"></div>
    </section>

    <section class="empty-state" id="emptyState">
      <svg viewBox="0 0 120 90" width="150" height="112" fill="none" aria-hidden="true">
        <rect x="18" y="10" width="84" height="58" rx="8" stroke="#3b4a75" stroke-width="2.5"/>
        <path d="M18 24h84" stroke="#3b4a75" stroke-width="2.5"/>
        <circle cx="27" cy="17" r="2.2" fill="#f87171"/><circle cx="35" cy="17" r="2.2" fill="#fbbf24"/><circle cx="43" cy="17" r="2.2" fill="#34d399"/>
        <rect x="32" y="36" width="56" height="6" rx="3" fill="#24314f"/>
        <rect x="32" y="36" width="34" height="6" rx="3" fill="url(#pg)"/>
        <rect x="32" y="50" width="40" height="6" rx="3" fill="#24314f"/>
        <rect x="32" y="50" width="18" height="6" rx="3" fill="#4f6bd8" opacity=".8"/>
        <path d="M60 72v10m0 0-6-6m6 6 6-6" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <defs>
          <linearGradient id="pg" x1="32" y1="36" x2="88" y2="42" gradientUnits="userSpaceOnUse">
            <stop stop-color="#7dd3fc"/><stop offset="1" stop-color="#6366f1"/>
          </linearGradient>
        </defs>
      </svg>
      <h3>No downloads yet</h3>
      <p>Paste a file URL above and hit <strong>Download</strong>.<br/>Large files are split into parallel segments for maximum speed.</p>
    </section>
  </main>

  <!-- Settings modal -->
  <div class="modal-backdrop" id="settingsModal" hidden>
    <div class="modal">
      <h3>Settings</h3>
      <label class="field">
        <span>Default segments per download</span>
        <input type="number" id="setSegments" min="1" max="16" value="8" />
      </label>
      <label class="field">
        <span>Max simultaneous downloads</span>
        <input type="number" id="setActive" min="1" max="8" value="3" />
      </label>
      <div class="modal-actions">
        <button class="ghost-btn" id="settingsCancel">Cancel</button>
        <button class="primary-btn" id="settingsSave">Save</button>
      </div>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script src="/app.js"></script>
</body>
</html>
