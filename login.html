<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Dinas Sosial</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/lambang-surakarta.svg">
  <link rel="stylesheet" href="assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="assets/vendor/boxicons/css/boxicons.min.css">
  <link rel="stylesheet" href="assets/css/frest-admin.css">
</head>
<body class="frest-body">

  <!-- Mirrors https://dinsos.surakarta.go.id/login 1:1 (Frest Split-Card Login) -->
  <div class="frest-auth-bg">
    <div class="frest-auth-card">
      <div class="row g-0">
        <!-- Left Login Form -->
        <div class="col-md-6 p-4 p-lg-5 d-flex flex-column justify-content-center">
          <div class="mb-3">
            <a href="index.html" class="btn btn-sm btn-outline-secondary fw-semibold">
              <i class="bx bx-left-arrow-alt me-1"></i>Kembali
            </a>
          </div>

          <div class="d-flex align-items-center gap-2 mb-3">
            <img src="assets/images/lambang-surakarta.svg" alt="Surakarta" style="height:42px;">
            <div>
              <h4 class="mb-0 fw-bold">Login Sistem</h4>
              <div class="small text-muted">CMS BackEnd — Dinas Sosial Kota Surakarta</div>
            </div>
          </div>

          <div id="loginAlertBox"></div>

          <form id="dinsosLoginForm" class="mt-2">
            <div class="mb-3">
              <label class="form-label fw-semibold text-dark" for="inpUsername">Username</label>
              <input type="text" id="inpUsername" class="form-control" placeholder="Username" value="admin" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold text-dark" for="inpPassword">Password</label>
              <div class="input-group">
                <input type="password" id="inpPassword" class="form-control" placeholder="Password" value="dinsos2026" required>
                <button class="btn btn-outline-secondary" type="button" id="togglePwdBtn" aria-label="Tampilkan Password">
                  <i class="bx bx-show"></i>
                </button>
              </div>
            </div>
            <button type="submit" class="btn btn-frest-primary w-100 py-2 mt-2 d-flex align-items-center justify-content-center gap-2">
              <span>Login</span>
              <i class="bx bx-right-arrow-alt fs-5"></i>
            </button>
          </form>

          <hr class="my-4">

          <div class="p-3 rounded-3 bg-light border small">
            <div class="fw-bold text-dark mb-2"><i class="bx bx-key text-primary me-1"></i>Akun Demo Role-Based Access Control (Klik untuk isi):</div>
            <div class="d-flex flex-wrap gap-1">
              <button type="button" class="btn btn-xs btn-sm btn-outline-primary py-1 px-2 demo-cred-btn" data-u="admin" data-p="dinsos2026">Superadmin</button>
              <button type="button" class="btn btn-xs btn-sm btn-outline-success py-1 px-2 demo-cred-btn" data-u="ppid_dinsos" data-p="ppid2026">Admin PPID</button>
              <button type="button" class="btn btn-xs btn-sm btn-outline-warning text-dark py-1 px-2 demo-cred-btn" data-u="admin_linjamsos" data-p="linjamsos2026">Operator Linjamsos</button>
            </div>
          </div>
        </div>

        <!-- Right Branding Illustration (Mirrors assets/other/people.png on live /login) -->
        <div class="col-md-6 frest-auth-right d-none d-md-flex flex-column text-center">
          <img src="assets/images/login/people.png" alt="branding logo" class="img-fluid rounded-3 mb-3" style="max-height:310px;">
          <h5 class="fw-bold mb-1">Sistem Manajemen Konten &amp; Layanan</h5>
          <p class="small text-muted mb-0">
            Terintegrasi langsung dengan Portal 15 Layanan, Website Publik, PPID, ULAS Aduan, &amp; SIM PMKS/PSKS Kota Surakarta.
          </p>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="assets/js/seed-data.js"></script>
  <script src="assets/js/db-engine.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      await window.DinsosDB.init();

      const uInp = document.getElementById("inpUsername");
      const pInp = document.getElementById("inpPassword");
      const alertBox = document.getElementById("loginAlertBox");

      document.getElementById("togglePwdBtn").addEventListener("click", () => {
        pInp.type = pInp.type === "password" ? "text" : "password";
      });

      document.querySelectorAll(".demo-cred-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          uInp.value = btn.dataset.u;
          pInp.value = btn.dataset.p;
        });
      });

      document.getElementById("dinsosLoginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const res = await window.DinsosDB.login(uInp.value, pInp.value);
        if (res.success) {
          window.location.href = "admin.html";
        } else {
          alertBox.innerHTML = `<div class="alert alert-danger py-2 small">${res.message}</div>`;
        }
      });
    });
  </script>
</body>
</html>
